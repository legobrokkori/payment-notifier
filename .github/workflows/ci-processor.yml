name: Payment Processor CI

on:
  push:
    paths:
      - 'payment-processor/**'
      - '.github/workflows/ci-processor.yml'
  pull_request:
    paths:
      - 'payment-processor/**'
      - '.github/workflows/ci-processor.yml'

jobs:
  processor-ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: payment
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION_STRING: Host=localhost;Port=5432;Username=user;Password=password;Database=payment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./payment-processor/.global.json

      - name: Restore dependencies
        run: dotnet restore
        working-directory: payment-processor

      - name: Install dotnet-ef CLI
        run: dotnet tool install --global dotnet-ef

      - name: Create database schema
        run: |
          # Use EnsureCreated instead of migrations since migrations were removed
          # Database will be created automatically by tests
          echo "Database schema will be created by EF Core EnsureCreated in tests"

      - name: Run code format check
        run: |
          dotnet format --verify-no-changes --verbosity diagnostic \
            --exclude src/PaymentProcessor/Infrastructure/Persistence/Migrations \
            --diagnostics "IDE*,SA1200,SA1201,SA1413"
        working-directory: payment-processor

      - name: Build with analyzers
        run: dotnet build --no-restore -warnaserror
        working-directory: payment-processor

      - name: Run tests
        run: dotnet test --no-restore --verbosity normal
        working-directory: payment-processor

      - name: Run integration tests
        run: |
          echo "Using DB_CONNECTION_STRING: $DB_CONNECTION_STRING"
          dotnet test tests/PaymentProcessor.IntegrationTests --no-restore --verbosity normal --logger "console;verbosity=detailed"
        working-directory: payment-processor